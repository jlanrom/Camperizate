# Publica los artículos del blog programados para hoy.
# Cada mañana regenera la web: si algún artículo de src/blog/ tiene hoy como fecha,
# aparece en web/, se hace commit en la rama principal y Cloudflare lo publica.
name: Publicar artículos programados

on:
  schedule:
    - cron: "15 5 * * *"   # 05:15 UTC: 06:15 en invierno y 07:15 en verano (hora de España)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow markdown
      - run: python3 src/build.py
      - name: Commit si hay artículos nuevos
        run: |
          if git diff --quiet -- web && [ -z "$(git ls-files --others --exclude-standard web)" ]; then
            echo "Nada que publicar hoy."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add web
          git commit -m "Publicar artículos programados ($(date -u +%F))"
          git push

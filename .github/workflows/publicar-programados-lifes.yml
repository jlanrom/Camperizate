# Publica los artículos programados del blog de Lifes Campers (camperizacionmalaga.com).
#
# GitHub solo ejecuta tareas programadas desde la rama principal del repositorio (kitamenagement),
# pero la web de Lifes Campers vive en otra rama. Esta tarea trabaja sobre esa rama:
# cada mañana regenera la web y, si algún artículo de src/blog/ tiene hoy como fecha, hace commit
# en esa rama y Cloudflare (proyecto crosscamper) lo publica. No toca nada de kitamenagement.
name: Publicar artículos programados (Lifes Campers)

on:
  schedule:
    - cron: "15 5 * * *"   # 05:15 UTC: 06:15 en invierno y 07:15 en verano (hora de España)
  workflow_dispatch:

permissions:
  contents: write

env:
  RAMA_LIFES: claude/create-vehicle-selector-011CUQkZuN99hZvuh7LL2TZ8

jobs:
  publicar:
    runs-on: ubuntu-24.04   # fijo: evita sorpresas cuando GitHub cambia ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RAMA_LIFES }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pillow markdown
      - run: python3 src/build.py
      - name: Commit si hay artículos nuevos
        run: |
          if git diff --quiet -- web && [ -z "$(git ls-files --others --exclude-standard web)" ]; then
            echo "Nada que publicar hoy."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add web
          git commit -m "Publicar artículos programados ($(date -u +%F))"
          git push origin "HEAD:${RAMA_LIFES}"

<!-- SELECTOR CON ESTILOS INLINE - IMPOSIBLE DE BLOQUEAR POR WEBNODE -->

<style>
/* Solo para desktop - layout horizontal */
@media (min-width: 769px) {
  #selector-container { display: flex !important; flex-direction: row !important; gap: 12px !important; align-items: flex-end !important; }
  #selector-marca-col { flex: 1 !important; }
  #selector-modelo-col { flex: 1 !important; }
  #selector-btn-col { flex: 0 0 auto !important; min-width: 180px !important; }
  .selector-label { font-size: 12px !important; margin-bottom: 8px !important; }
  .selector-field { height: auto !important; padding: 14px 44px 14px 18px !important; }
  .selector-arrow { right: 18px !important; }
  #v-btn { height: auto !important; padding: 14px 28px !important; }
}
</style>

<div style="max-width:820px;margin:0 auto;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <div id="selector-container" style="display:flex;flex-direction:column;gap:8px;margin:0;padding:0">

    <!-- Marca -->
    <div id="selector-marca-col" style="width:100%;margin:0;padding:0">
      <label for="v-marca" class="selector-label" style="display:block;font-size:11px;font-weight:700;color:#1a202c;margin:0 0 3px 0;padding:0;text-transform:uppercase">Marca</label>
      <div style="position:relative;margin:0;padding:0">
        <select id="v-marca" class="selector-field" style="width:100%;padding:8px 40px 8px 12px;border:2px solid #e2e8f0;border-radius:8px;font-size:16px;color:#1a202c;background:#fff;height:40px;margin:0;appearance:none;-webkit-appearance:none">
          <option value="">Selecciona tu marca...</option>
        </select>
        <span class="selector-arrow" style="position:absolute;right:14px;top:50%;transform:translateY(-50%);color:#718096;font-size:9px;pointer-events:none">▼</span>
      </div>
    </div>

    <!-- Modelo -->
    <div id="selector-modelo-col" style="width:100%;margin:0;padding:0">
      <label for="v-modelo" class="selector-label" style="display:block;font-size:11px;font-weight:700;color:#1a202c;margin:0 0 3px 0;padding:0;text-transform:uppercase">Modelo</label>
      <div style="position:relative;margin:0;padding:0">
        <select id="v-modelo" class="selector-field" disabled style="width:100%;padding:8px 40px 8px 12px;border:2px solid #e2e8f0;border-radius:8px;font-size:16px;color:#1a202c;background:#f7fafc;height:40px;margin:0;appearance:none;-webkit-appearance:none">
          <option value="">Primero selecciona marca</option>
        </select>
        <span class="selector-arrow" style="position:absolute;right:14px;top:50%;transform:translateY(-50%);color:#718096;font-size:9px;pointer-events:none">▼</span>
      </div>
    </div>

    <!-- Botón -->
    <div id="selector-btn-col" style="width:100%;margin:0;padding:0">
      <a href="#" id="v-btn" style="display:flex;align-items:center;justify-content:center;width:100%;padding:8px 16px;background:linear-gradient(135deg,#f15a29 0%,#e63946 100%);color:#fff;text-decoration:none;border-radius:8px;font-size:15px;font-weight:600;height:40px;margin:0;opacity:0.6;pointer-events:none" onclick="return false">
        Ver Opciones →
      </a>
    </div>

  </div>
</div>

<script>

    }
  };

  var m = document.getElementById('v-marca');
  var n = document.getElementById('v-modelo');
  var b = document.getElementById('v-btn');

  function u() {
    var mr = m.value, mo = n.value;
    if (mr && mo && d[mr] && d[mr][mo]) {
      b.href = d[mr][mo];
      b.style.opacity = '1';
      b.style.pointerEvents = 'auto';
      b.removeAttribute('onclick');
    } else {
      b.href = '#';
      b.style.opacity = '0.6';
      b.style.pointerEvents = 'none';
      b.setAttribute('onclick', 'return false');
    }
  }

  Object.keys(d).forEach(function(k) {
    var o = document.createElement('option');
    o.value = k;
    o.textContent = k;
    m.appendChild(o);
  });

  m.onchange = function() {
    var v = m.value;
    n.innerHTML = '<option value="">Selecciona tu modelo...</option>';
    n.disabled = true;
    n.style.background = '#f7fafc';
    if (v && d[v]) {
      n.disabled = false;
      n.style.background = '#fff';
      Object.keys(d[v]).forEach(function(k) {
        var o = document.createElement('option');
        o.value = k;
        o.textContent = k;
        n.appendChild(o);
      });
    }
    u();
  };

  n.onchange = u;
  u();
})();
</script>

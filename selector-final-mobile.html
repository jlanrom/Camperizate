<!-- SELECTOR DE VEHÍCULOS - SIN DARK MODE, OPTIMIZADO MÓVIL -->

<style>
/* === VARIABLES CSS === */
:root {
  --color-primary: #f15a29;
  --color-primary-dark: #e63946;
  --color-primary-darker: #d62828;
  --color-text: #1a202c;
  --color-text-light: #718096;
  --color-border: #e2e8f0;
  --color-bg: #ffffff;
  --color-bg-disabled: #f7fafc;
  --radius: 16px;
  --radius-sm: 12px;
  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.06);
  --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.08);
  --shadow-primary: 0 4px 16px rgba(241, 90, 41, 0.3);
  --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}

/* === CONTENEDOR === */
.vehicle-selector {
  max-width: 820px;
  margin: 0 auto;
  padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* === LAYOUT === */
.vehicle-selector__row {
  display: flex;
  gap: 12px;
  align-items: flex-end;
}

.vehicle-selector__col {
  flex: 1 1 220px;
  min-width: 0;
}

.vehicle-selector__btn-col {
  flex: 0 0 auto;
  min-width: 180px;
}

/* === LABELS === */
.vehicle-selector__label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  color: var(--color-text);
  margin-bottom: 8px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}

/* === SELECTORES === */
.vehicle-selector__select-wrapper {
  position: relative;
}

.vehicle-selector__select-wrapper::after {
  content: '▼';
  position: absolute;
  right: 18px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--color-text-light);
  font-size: 10px;
  pointer-events: none;
  transition: var(--transition);
}

.vehicle-selector__select-wrapper:hover::after {
  color: var(--color-primary);
}

.vehicle-selector__select {
  width: 100%;
  padding: 14px 50px 14px 18px;
  border: 2px solid var(--color-border);
  border-radius: var(--radius);
  font-size: 15px;
  color: var(--color-text);
  background: var(--color-bg);
  cursor: pointer;
  appearance: none;
  -webkit-appearance: none;
  -moz-appearance: none;
  transition: var(--transition);
  box-shadow: var(--shadow-sm);
  font-weight: 500;
}

.vehicle-selector__select:hover:not(:disabled) {
  border-color: var(--color-primary);
  box-shadow: var(--shadow-md);
  transform: translateY(-1px);
}

.vehicle-selector__select:focus {
  outline: none;
  border-color: var(--color-primary);
  box-shadow: 0 0 0 4px rgba(241, 90, 41, 0.15), var(--shadow-md);
  transform: translateY(-1px);
}

.vehicle-selector__select:disabled {
  background: var(--color-bg-disabled);
  color: var(--color-text-light);
  cursor: not-allowed;
  opacity: 0.7;
  border-color: var(--color-border);
  box-shadow: none;
  transform: none;
}

/* === BOTÓN === */
.vehicle-selector__btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  padding: 14px 28px;
  background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
  color: #ffffff;
  text-decoration: none;
  text-align: center;
  border-radius: var(--radius);
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.3px;
  transition: var(--transition);
  box-shadow: var(--shadow-primary);
  cursor: pointer;
  position: relative;
  overflow: hidden;
}

.vehicle-selector__btn::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
  transition: left 0.5s ease;
}

.vehicle-selector__btn:not(.disabled):hover {
  background: linear-gradient(135deg, var(--color-primary-dark) 0%, var(--color-primary-darker) 100%);
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(241, 90, 41, 0.4);
  color: #ffffff;
}

.vehicle-selector__btn:not(.disabled):hover::before {
  left: 100%;
}

.vehicle-selector__btn:not(.disabled):active {
  transform: translateY(0) scale(0.98);
  box-shadow: var(--shadow-primary);
}

.vehicle-selector__btn.disabled {
  background: linear-gradient(135deg, #e2e8f0 0%, #cbd5e0 100%);
  color: var(--color-text-light);
  box-shadow: var(--shadow-sm);
  cursor: not-allowed;
  pointer-events: none;
  opacity: 0.6;
}

/* === RESPONSIVE MÓVIL === */
@media (max-width: 768px) {
  .vehicle-selector__row {
    flex-direction: column;
    gap: 0;
  }

  .vehicle-selector__col,
  .vehicle-selector__btn-col {
    width: 100%;
    min-width: 0;
    margin-bottom: 10px; /* Espacio entre elementos */
  }

  .vehicle-selector__btn-col {
    margin-bottom: 0;
  }

  .vehicle-selector__label {
    font-size: 12px;
    margin-bottom: 4px; /* Muy reducido */
  }

  /* Selectores mucho más compactos */
  .vehicle-selector__select {
    padding: 10px 44px 10px 14px; /* Padding reducido drásticamente */
    font-size: 16px;
    min-height: 44px; /* Reducido de 52px */
    border-radius: 10px;
  }

  .vehicle-selector__select-wrapper::after {
    right: 16px;
    font-size: 10px;
  }

  /* Botón más compacto */
  .vehicle-selector__btn {
    padding: 10px 20px; /* Padding reducido */
    font-size: 15px;
    min-height: 44px; /* Reducido de 52px */
    border-radius: 10px;
    font-weight: 600;
  }

  /* Feedback táctil */
  .vehicle-selector__select:active:not(:disabled) {
    transform: scale(0.98);
  }

  .vehicle-selector__btn:not(.disabled):active {
    transform: scale(0.96);
  }
}

/* === MÓVILES PEQUEÑOS === */
@media (max-width: 480px) {
  .vehicle-selector__col,
  .vehicle-selector__btn-col {
    margin-bottom: 8px;
  }

  .vehicle-selector__label {
    margin-bottom: 3px;
  }

  .vehicle-selector__select {
    padding: 9px 42px 9px 12px;
    min-height: 42px;
  }

  .vehicle-selector__btn {
    padding: 9px 18px;
    min-height: 42px;
  }
}

/* === ANIMACIÓN === */
@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.vehicle-selector {
  animation: fadeIn 0.3s ease-out;
}

/* === ACCESIBILIDAD === */
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

.vehicle-selector__select:focus-visible {
  outline: 3px solid var(--color-primary);
  outline-offset: 2px;
}
</style>

<div class="vehicle-selector">
  <div class="vehicle-selector__row">
    <!-- Selector de Marca -->
    <div class="vehicle-selector__col">
      <label for="vehicle-marca" class="vehicle-selector__label">Marca</label>
      <div class="vehicle-selector__select-wrapper">
        <select
          id="vehicle-marca"
          class="vehicle-selector__select"
          aria-label="Seleccionar marca del vehículo"
          aria-required="true">
          <option value="">Selecciona tu marca...</option>
        </select>
      </div>
    </div>

    <!-- Selector de Modelo -->
    <div class="vehicle-selector__col">
      <label for="vehicle-modelo" class="vehicle-selector__label">Modelo</label>
      <div class="vehicle-selector__select-wrapper">
        <select
          id="vehicle-modelo"
          class="vehicle-selector__select"
          disabled
          aria-label="Seleccionar modelo del vehículo"
          aria-required="true">
          <option value="">Primero selecciona marca</option>
        </select>
      </div>
    </div>

    <!-- Botón de búsqueda -->
    <div class="vehicle-selector__btn-col">
      <a
        href="#"
        id="vehicle-btn"
        class="vehicle-selector__btn disabled"
        aria-label="Ver opciones de equipamiento"
        aria-disabled="true">
        Ver Opciones →
      </a>
    </div>
  </div>
</div>

<script>
(function() {
  'use strict';

  // Base de datos de vehículos
  var vehicleData = {
    "Citroën": {

      "Jumpy": "https://www.camperizatetodoen1.com/jumpy/",
      "Space Tourer": "https://www.camperizatetodoen1.com/space-tourer/",

    },
    "Dacia": {
      "Dokker": "https://www.camperizatetodoen1.com/dokker/",
      "Jogger": "https://www.camperizatetodoen1.com/dacia-jogger-lodgy/",
      "Lodgy": "https://www.camperizatetodoen1.com/dacia-jogger-lodgy/"
    },
    "Fiat": {
      "Doblo": "https://www.camperizatetodoen1.com/fiat-doblo/",
      "Scudo": "https://www.camperizatetodoen1.com/fiat-scudo/",
      "Talento": "https://www.camperizatetodoen1.com/talento/",
      "Ducato": "https://www.camperizatetodoen1.com/jumper-boxer-transit/"
    },
    "Ford": {
      "Transit Connect": "https://www.camperizatetodoen1.com/tourneo-transit/",
      "Courier": "https://www.camperizatetodoen1.com/ford-courier/",
      "Transit Custom": "https://www.camperizatetodoen1.com/ford-transit-custom/",
      "Transit": "https://www.camperizatetodoen1.com/jumper-boxer-transit/"
    },
    "Hyundai": {
      "H1": "https://www.camperizatetodoen1.com/hyundai-h1/"
    },
    "Mercedes": {
      "Citan": "https://www.camperizatetodoen1.com/mercedes-citan/",
      "Vito": "https://www.camperizatetodoen1.com/vito-viano/",
      "Viano": "https://www.camperizatetodoen1.com/vito-viano/",
      "Sprinter": "https://www.camperizatetodoen1.com/jumper-boxer-transit/"
    },
    "Nissan": {
      "Townstar": "https://www.camperizatetodoen1.com/nissan-townstar/",
      "NV200": "https://www.camperizatetodoen1.com/nv200/",
      "NV300": "https://www.camperizatetodoen1.com/nv300/",
      "Primastar": "https://www.camperizatetodoen1.com/nv300/"
    },
    "Opel": {
      "Combo": "https://www.camperizatetodoen1.com/opel-combo-life/",
      "Vivaro": "https://www.camperizatetodoen1.com/opel-vivaro/",
      "Zafira": "https://www.camperizatetodoen1.com/opel-vivaro/",
      "Movano": "https://www.camperizatetodoen1.com/jumper-boxer-transit/"
    },
    "Peugeot": {
      "Partner": "https://www.camperizatetodoen1.com/partner/",
      "Rifter": "https://www.camperizatetodoen1.com/rifter/",
      "Traveller": "https://www.camperizatetodoen1.com/traveller/",
      "Expert": "https://www.camperizatetodoen1.com/expert/",

    },
    "Renault": {

      "Master": "https://www.camperizatetodoen1.com/jumper-boxer-transit/"
    },
    "Volkswagen": {
      "Caddy": "https://www.camperizatetodoen1.com/caddy/",
      "Transporter T4": "https://www.camperizatetodoen1.com/transporter-t4-t5-t6/",
      "Transporter T5": "https://www.camperizatetodoen1.com/transporter-t4-t5-t6/",
      "Transporter T6": "https://www.camperizatetodoen1.com/transporter-t4-t5-t6/",
      "Caravelle": "https://www.camperizatetodoen1.com/caravelle-t4-t5-t6/",
      "Multivan": "https://www.camperizatetodoen1.com/caravelle-t4-t5-t6/",
      "Crafter": "https://www.camperizatetodoen1.com/jumper-boxer-transit/"
    },
    "Toyota": {
      "Proace City": "https://www.camperizatetodoen1.com/proace-city/",
      "Proace": "https://www.camperizatetodoen1.com/toyota-proace/"
    },
    "Otros": {
      "Coches y Monovolumen": "https://www.camperizatetodoen1.com/coches-monovolumen-y-4x4/",
      "2+1": "https://www.camperizatetodoen1.com/2-12/"
    }
  };

  // Referencias DOM
  var selectMarca = document.getElementById('vehicle-marca');
  var selectModelo = document.getElementById('vehicle-modelo');
  var btn = document.getElementById('vehicle-btn');

  // Actualizar enlace
  function updateLink() {
    var marca = selectMarca.value;
    var modelo = selectModelo.value;

    if (marca && modelo && vehicleData[marca] && vehicleData[marca][modelo]) {
      var url = vehicleData[marca][modelo];
      btn.href = url;
      btn.classList.remove('disabled');
      btn.removeAttribute('onclick');
      btn.setAttribute('aria-disabled', 'false');
    } else {
      btn.href = '#';
      btn.classList.add('disabled');
      btn.setAttribute('onclick', 'return false');
      btn.setAttribute('aria-disabled', 'true');
    }
  }

  // Cargar marcas
  var fragment = document.createDocumentFragment();
  Object.keys(vehicleData).forEach(function(marca) {
    var option = document.createElement('option');
    option.value = marca;
    option.textContent = marca;
    fragment.appendChild(option);
  });
  selectMarca.appendChild(fragment);

  // Cambio de marca
  selectMarca.addEventListener('change', function() {
    var marca = this.value;

    selectModelo.innerHTML = '<option value="">Selecciona tu modelo...</option>';
    selectModelo.disabled = true;

    if (marca && vehicleData[marca]) {
      selectModelo.disabled = false;

      var modeloFragment = document.createDocumentFragment();
      Object.keys(vehicleData[marca]).forEach(function(modelo) {
        var option = document.createElement('option');
        option.value = modelo;
        option.textContent = modelo;
        modeloFragment.appendChild(option);
      });
      selectModelo.appendChild(modeloFragment);
    }

    updateLink();
  });

  // Cambio de modelo
  selectModelo.addEventListener('change', updateLink);

  // Inicializar
  updateLink();
})();
</script>

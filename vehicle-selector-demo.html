<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selector de Vehículos - Camperízate Todo en 1</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .selector-container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 500px;
      width: 100%;
      padding: 40px;
      animation: fadeInUp 0.6s ease-out;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header h1 {
      color: #2d3748;
      font-size: 28px;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .header p {
      color: #718096;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
      position: relative;
    }

    .form-group label {
      display: block;
      color: #4a5568;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
      transition: color 0.3s ease;
    }

    .form-group.active label {
      color: #667eea;
    }

    .select-wrapper {
      position: relative;
    }

    .select-wrapper::after {
      content: '▼';
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #a0aec0;
      pointer-events: none;
      font-size: 12px;
      transition: transform 0.3s ease;
    }

    .select-wrapper.open::after {
      transform: translateY(-50%) rotate(180deg);
    }

    select {
      width: 100%;
      padding: 14px 40px 14px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 16px;
      color: #2d3748;
      background: white;
      cursor: pointer;
      transition: all 0.3s ease;
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
    }

    select:hover:not(:disabled) {
      border-color: #cbd5e0;
    }

    select:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    select:disabled {
      background: #f7fafc;
      cursor: not-allowed;
      opacity: 0.6;
    }

    select option {
      padding: 10px;
    }

    .btn-buscar {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-buscar:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
    }

    .btn-buscar:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-buscar:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .icon-car {
      font-size: 48px;
      margin-bottom: 10px;
      animation: bounce 2s infinite;
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-10px);
      }
    }

    .selected-info {
      margin-top: 20px;
      padding: 16px;
      background: #f7fafc;
      border-radius: 12px;
      border-left: 4px solid #667eea;
      display: none;
    }

    .selected-info.show {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    .selected-info p {
      color: #4a5568;
      font-size: 14px;
      margin: 4px 0;
    }

    .selected-info strong {
      color: #2d3748;
    }

    @media (max-width: 600px) {
      .selector-container {
        padding: 30px 20px;
      }

      .header h1 {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="selector-container">
    <div class="header">
      <div class="icon-car">🚐</div>
      <h1>Encuentra tu Vehículo</h1>
      <p>Selecciona tu marca y modelo para comenzar</p>
    </div>

    <form id="vehicleForm">
      <div class="form-group" id="grupo-marca">
        <label for="marca">Marca del Vehículo</label>
        <div class="select-wrapper">
          <select id="marca" name="marca">
            <option value="">Elige una marca...</option>
          </select>
        </div>
      </div>

      <div class="form-group" id="grupo-modelo">
        <label for="modelo">Modelo del Vehículo</label>
        <div class="select-wrapper">
          <select id="modelo" name="modelo" disabled>
            <option value="">Primero selecciona una marca</option>
          </select>
        </div>
      </div>

      <div class="form-group" id="grupo-generacion">
        <label for="generacion">Generación / Año</label>
        <div class="select-wrapper">
          <select id="generacion" name="generacion" disabled>
            <option value="">Primero selecciona un modelo</option>
          </select>
        </div>
      </div>

      <button type="button" id="buscar" class="btn-buscar" disabled>
        Ver mi vehículo
      </button>

      <div class="selected-info" id="selectedInfo">
        <p><strong>Selección:</strong></p>
        <p id="infoText"></p>
      </div>
    </form>
  </div>

  <script>
    // Datos de vehículos (PUEDES MODIFICAR ESTA ESTRUCTURA)
    const datos = {
      "Volkswagen": {
        "Transporter": {
          "T4 (1990-2003)": "https://camperizatetodoen1.com/volkswagen-transporter-t4",
          "T5 (2003-2010)": "https://camperizatetodoen1.com/volkswagen-transporter-t5",
          "T6 & T6.1 (2015-2025)": "https://camperizatetodoen1.com/volkswagen-transporter-t6",
          "T7 (desde 2025)": "https://camperizatetodoen1.com/volkswagen-transporter-t7"
        },
        "Caddy": {
          "Caddy 3 (2004-2015)": "https://camperizatetodoen1.com/volkswagen-caddy-3",
          "Caddy 4 (2015-2020)": "https://camperizatetodoen1.com/volkswagen-caddy-4",
          "Caddy 5 (desde 2020)": "https://camperizatetodoen1.com/volkswagen-caddy-5"
        },
        "California": {
          "T6 (2015-2020)": "https://camperizatetodoen1.com/volkswagen-california-t6",
          "T6.1 (desde 2020)": "https://camperizatetodoen1.com/volkswagen-california-t6-1"
        }
      },
      "Mercedes": {
        "Vito": {
          "W638 (1996-2003)": "https://camperizatetodoen1.com/mercedes-vito-w638",
          "W639 (2003-2014)": "https://camperizatetodoen1.com/mercedes-vito-w639",
          "W447 (desde 2014)": "https://camperizatetodoen1.com/mercedes-vito-w447"
        },
        "Sprinter": {
          "906 (2006-2018)": "https://camperizatetodoen1.com/mercedes-sprinter-906",
          "907 (desde 2018)": "https://camperizatetodoen1.com/mercedes-sprinter-907"
        }
      },
      "Fiat": {
        "Ducato": {
          "X250 (2006-2014)": "https://camperizatetodoen1.com/fiat-ducato-x250",
          "X290 (desde 2014)": "https://camperizatetodoen1.com/fiat-ducato-x290"
        },
        "Dobló": {
          "2ª Gen (2010-2022)": "https://camperizatetodoen1.com/fiat-doblo-2gen",
          "3ª Gen (desde 2022)": "https://camperizatetodoen1.com/fiat-doblo-3gen"
        }
      },
      "Citroën": {
        "Jumper": {
          "2ª Gen (2006-2021)": "https://camperizatetodoen1.com/citroen-jumper-2gen",
          "3ª Gen (desde 2021)": "https://camperizatetodoen1.com/citroen-jumper-3gen"
        },
        "Berlingo": {
          "2ª Gen (2008-2018)": "https://camperizatetodoen1.com/citroen-berlingo-2gen",
          "3ª Gen (desde 2018)": "https://camperizatetodoen1.com/citroen-berlingo-3gen"
        }
      },
      "Peugeot": {
        "Boxer": {
          "2ª Gen (2006-2021)": "https://camperizatetodoen1.com/peugeot-boxer-2gen",
          "3ª Gen (desde 2021)": "https://camperizatetodoen1.com/peugeot-boxer-3gen"
        },
        "Partner": {
          "2ª Gen (2008-2018)": "https://camperizatetodoen1.com/peugeot-partner-2gen",
          "3ª Gen (desde 2018)": "https://camperizatetodoen1.com/peugeot-partner-3gen"
        }
      },
      "Renault": {
        "Trafic": {
          "3ª Gen (desde 2014)": "https://camperizatetodoen1.com/renault-trafic-3gen"
        },
        "Master": {
          "3ª Gen (desde 2010)": "https://camperizatetodoen1.com/renault-master-3gen"
        }
      },
      "Ford": {
        "Transit": {
          "6ª Gen (2006-2014)": "https://camperizatetodoen1.com/ford-transit-6gen",
          "7ª Gen (desde 2014)": "https://camperizatetodoen1.com/ford-transit-7gen"
        },
        "Transit Custom": {
          "1ª Gen (desde 2012)": "https://camperizatetodoen1.com/ford-transit-custom-1gen"
        }
      }
    };

    // Referencias a elementos
    const selMarca = document.getElementById('marca');
    const selModelo = document.getElementById('modelo');
    const selGener = document.getElementById('generacion');
    const btnBuscar = document.getElementById('buscar');
    const selectedInfo = document.getElementById('selectedInfo');
    const infoText = document.getElementById('infoText');

    // Cargar marcas al inicio
    function cargarMarcas() {
      Object.keys(datos).sort().forEach(marca => {
        const opt = document.createElement('option');
        opt.value = marca;
        opt.textContent = marca;
        selMarca.appendChild(opt);
      });
    }

    // Actualizar info seleccionada
    function actualizarInfo() {
      const marca = selMarca.value;
      const modelo = selModelo.value;
      const generacion = selGener.value;

      if (marca && modelo && generacion) {
        infoText.textContent = `${marca} ${modelo} - ${generacion}`;
        selectedInfo.classList.add('show');
      } else {
        selectedInfo.classList.remove('show');
      }
    }

    // Animación de select activo
    function toggleSelectAnimation(selectElement) {
      selectElement.addEventListener('focus', function() {
        this.closest('.select-wrapper').classList.add('open');
        this.closest('.form-group').classList.add('active');
      });

      selectElement.addEventListener('blur', function() {
        this.closest('.select-wrapper').classList.remove('open');
        this.closest('.form-group').classList.remove('active');
      });
    }

    // Aplicar animaciones
    [selMarca, selModelo, selGener].forEach(toggleSelectAnimation);

    // Evento: cambio de marca
    selMarca.addEventListener('change', () => {
      const marca = selMarca.value;

      // Reset modelo y generación
      selModelo.innerHTML = '<option value="">Selecciona un modelo...</option>';
      selGener.innerHTML = '<option value="">Primero selecciona un modelo</option>';
      selModelo.disabled = true;
      selGener.disabled = true;
      btnBuscar.disabled = true;

      if (marca && datos[marca]) {
        selModelo.disabled = false;
        Object.keys(datos[marca]).sort().forEach(modelo => {
          const opt = document.createElement('option');
          opt.value = modelo;
          opt.textContent = modelo;
          selModelo.appendChild(opt);
        });
      }

      actualizarInfo();
    });

    // Evento: cambio de modelo
    selModelo.addEventListener('change', () => {
      const marca = selMarca.value;
      const modelo = selModelo.value;

      // Reset generación
      selGener.innerHTML = '<option value="">Selecciona una generación...</option>';
      selGener.disabled = true;
      btnBuscar.disabled = true;

      if (marca && modelo && datos[marca][modelo]) {
        selGener.disabled = false;
        Object.keys(datos[marca][modelo]).forEach(gen => {
          const opt = document.createElement('option');
          opt.value = gen;
          opt.textContent = gen;
          selGener.appendChild(opt);
        });
      }

      actualizarInfo();
    });

    // Evento: cambio de generación
    selGener.addEventListener('change', () => {
      const marca = selMarca.value;
      const modelo = selModelo.value;
      const generacion = selGener.value;

      btnBuscar.disabled = !(marca && modelo && generacion);
      actualizarInfo();
    });

    // Evento: click en buscar
    btnBuscar.addEventListener('click', () => {
      const marca = selMarca.value;
      const modelo = selModelo.value;
      const generacion = selGener.value;

      if (marca && modelo && generacion && datos[marca][modelo][generacion]) {
        const url = datos[marca][modelo][generacion];
        window.open(url, '_blank');
      }
    });

    // Inicializar
    cargarMarcas();
  </script>
</body>
</html>

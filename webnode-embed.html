<!-- SELECTOR DE VEHÍCULOS - Copiar y pegar en bloque HTML de Webnode -->

<style>
  .vehiculo-selector-container * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  .vehiculo-selector-container {
    font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: white;
    border-radius: 12px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
    border: 1px solid #ddd;
    max-width: 900px;
    width: 100%;
    padding: 40px;
    margin: 40px auto;
  }

  .vehiculo-selector-container .header {
    text-align: center;
    margin-bottom: 35px;
  }

  .vehiculo-selector-container .header h2 {
    color: #333;
    font-size: 28px;
    margin-bottom: 8px;
    font-weight: 600;
  }

  .vehiculo-selector-container .header p {
    color: #888;
    font-size: 15px;
  }

  .vehiculo-selector-container .icon-car {
    font-size: 48px;
    margin-bottom: 10px;
  }

  .vehiculo-selector-container .form-row {
    display: flex;
    gap: 15px;
    align-items: flex-end;
    margin-bottom: 20px;
  }

  .vehiculo-selector-container .form-group {
    flex: 1;
    position: relative;
  }

  .vehiculo-selector-container .form-group label {
    display: block;
    color: #333;
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 8px;
    transition: color 0.2s ease-in-out;
  }

  .vehiculo-selector-container .form-group.active label {
    color: #f15a29;
  }

  .vehiculo-selector-container .select-wrapper {
    position: relative;
  }

  .vehiculo-selector-container .select-wrapper::after {
    content: '▼';
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: #888;
    pointer-events: none;
    font-size: 11px;
    transition: transform 0.2s ease-in-out;
  }

  .vehiculo-selector-container .select-wrapper.open::after {
    transform: translateY(-50%) rotate(180deg);
  }

  .vehiculo-selector-container select {
    width: 100%;
    padding: 14px 38px 14px 14px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 15px;
    color: #333;
    background: white;
    cursor: pointer;
    transition: all 0.2s ease-in-out;
    appearance: none;
    -webkit-appearance: none;
    -moz-appearance: none;
  }

  .vehiculo-selector-container select:hover:not(:disabled) {
    border-color: #f15a29;
    background: #faf7f5;
  }

  .vehiculo-selector-container select:focus {
    outline: none;
    border-color: #f15a29;
    box-shadow: 0 0 0 3px rgba(241, 90, 41, 0.1);
  }

  .vehiculo-selector-container select:disabled {
    background: #f5f5f5;
    cursor: not-allowed;
    opacity: 0.6;
    border-color: #e5e5e5;
  }

  .vehiculo-selector-container select option {
    padding: 10px;
  }

  .vehiculo-selector-container .btn-group {
    flex: 0 0 auto;
    min-width: 180px;
  }

  .vehiculo-selector-container .btn-buscar {
    width: 100%;
    padding: 14px 24px;
    background: #f15a29;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease-in-out;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .vehiculo-selector-container .btn-buscar:hover:not(:disabled) {
    background: #e34a1a;
    transform: translateY(-2px);
    box-shadow: 0 6px 12px rgba(241, 90, 41, 0.3);
  }

  .vehiculo-selector-container .btn-buscar:active:not(:disabled) {
    transform: translateY(0);
  }

  .vehiculo-selector-container .btn-buscar:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
    background: #ccc;
  }

  .vehiculo-selector-container .selected-info {
    margin-top: 25px;
    padding: 16px 20px;
    background: #faf7f5;
    border-radius: 8px;
    border-left: 4px solid #f15a29;
    display: none;
  }

  .vehiculo-selector-container .selected-info.show {
    display: block;
  }

  .vehiculo-selector-container .selected-info p {
    color: #333;
    font-size: 14px;
    margin: 0;
  }

  .vehiculo-selector-container .selected-info strong {
    color: #f15a29;
  }

  /* Responsive - móvil en vertical */
  @media (max-width: 768px) {
    .vehiculo-selector-container {
      padding: 30px 20px;
    }

    .vehiculo-selector-container .header h2 {
      font-size: 24px;
    }

    .vehiculo-selector-container .form-row {
      flex-direction: column;
      gap: 18px;
    }

    .vehiculo-selector-container .form-group {
      width: 100%;
    }

    .vehiculo-selector-container .btn-group {
      width: 100%;
      min-width: auto;
    }

    .vehiculo-selector-container select {
      padding: 16px 38px 16px 14px;
    }

    .vehiculo-selector-container .btn-buscar {
      padding: 16px 24px;
    }
  }
</style>

<div class="vehiculo-selector-container">
  <div class="header">
    <div class="icon-car">🚐</div>
    <h2>Selecciona tu furgoneta</h2>
    <p>Encuentra el equipamiento para tu vehículo</p>
  </div>

  <form id="vehicleFormWebnode">
    <div class="form-row">
      <div class="form-group" id="grupo-marca-webnode">
        <label for="marca-webnode">Marca</label>
        <div class="select-wrapper">
          <select id="marca-webnode" name="marca">
            <option value="">Selecciona marca...</option>
          </select>
        </div>
      </div>

      <div class="form-group" id="grupo-modelo-webnode">
        <label for="modelo-webnode">Modelo</label>
        <div class="select-wrapper">
          <select id="modelo-webnode" name="modelo" disabled>
            <option value="">Selecciona modelo...</option>
          </select>
        </div>
      </div>

      <div class="btn-group">
        <button type="button" id="buscar-webnode" class="btn-buscar" disabled>
          🔍 Buscar
        </button>
      </div>
    </div>

    <div class="selected-info" id="selectedInfo-webnode">
      <p><strong>Selección:</strong> <span id="infoText-webnode"></span></p>
    </div>
  </form>
</div>

<script>
(function() {
  // Datos completos de vehículos
  const datosVehiculos = {
    "Citroën": {
      "Berlingo": "/berlingo/",
      "Jumpy": "/jumpy/",
      "Space Tourer": "/space-tourer/",
      "Jumper": "/jumper-boxer-transit/"
    },
    "Dacia": {
      "Dokker": "/dokker/",
      "Jogger / Lodgy": "/dacia-jogger-lodgy/"
    },
    "Fiat": {
      "Doblo": "/fiat-doblo/",
      "Scudo": "/fiat-scudo/",
      "Talento": "/talento/",
      "Ducato": "/jumper-boxer-transit/"
    },
    "Ford": {
      "Tourneo / Transit Connect": "/tourneo-transit/",
      "Courier": "/ford-courier/",
      "Transit Custom": "/ford-transit-custom/",
      "Transit": "/jumper-boxer-transit/"
    },
    "Hyundai": {
      "H1": "/hyundai-h1/"
    },
    "Mercedes": {
      "Citan - Clase T": "/mercedes-citan/",
      "Vito / Viano": "/vito-viano/"
    },
    "Nissan": {
      "Townstar": "/nissan-townstar/",
      "NV200": "/nv200/",
      "NV300 / Primastar": "/nv300/"
    },
    "Opel": {
      "Combo Life": "/opel-combo-life/",
      "Vivaro / Zafira": "/opel-vivaro/",
      "Movano": "/jumper-boxer-transit/"
    },
    "Peugeot": {
      "Partner": "/partner/",
      "Rifter": "/rifter/",
      "Traveller": "/traveller/",
      "Expert": "/expert/",
      "Boxer": "/jumper-boxer-transit/"
    },
    "Renault": {
      "Kangoo": "/renault-kangoo/",
      "Trafic": "/trafic/",
      "Master": "/jumper-boxer-transit/"
    },
    "Volkswagen": {
      "Caddy": "/caddy/",
      "Transporter T4, T5, T6": "/transporter-t4-t5-t6/",
      "Caravelle T4, T5, T6": "/caravelle-t4-t5-t6/"
    },
    "Toyota": {
      "Proace City": "/proace-city/",
      "Proace / Proace Verso": "/toyota-proace/"
    },
    "Otros": {
      "Coches, Monovolumen y 4x4": "/coches-monovolumen-y-4x4/",
      "2+1": "/2-12/"
    }
  };

  // Referencias a elementos DOM
  const selMarca = document.getElementById('marca-webnode');
  const selModelo = document.getElementById('modelo-webnode');
  const btnBuscar = document.getElementById('buscar-webnode');
  const selectedInfo = document.getElementById('selectedInfo-webnode');
  const infoText = document.getElementById('infoText-webnode');

  // Cargar marcas
  function cargarMarcas() {
    Object.keys(datosVehiculos).forEach(marca => {
      const opt = document.createElement('option');
      opt.value = marca;
      opt.textContent = marca;
      selMarca.appendChild(opt);
    });
  }

  // Actualizar info
  function actualizarInfo() {
    const marca = selMarca.value;
    const modelo = selModelo.value;

    if (marca && modelo) {
      infoText.textContent = marca + ' ' + modelo;
      selectedInfo.classList.add('show');
    } else {
      selectedInfo.classList.remove('show');
    }
  }

  // Animaciones
  function toggleSelectAnimation(selectElement) {
    selectElement.addEventListener('focus', function() {
      this.closest('.select-wrapper').classList.add('open');
      this.closest('.form-group').classList.add('active');
    });

    selectElement.addEventListener('blur', function() {
      this.closest('.select-wrapper').classList.remove('open');
      this.closest('.form-group').classList.remove('active');
    });
  }

  [selMarca, selModelo].forEach(toggleSelectAnimation);

  // Cambio de marca
  selMarca.addEventListener('change', function() {
    const marca = selMarca.value;

    selModelo.innerHTML = '<option value="">Selecciona un modelo...</option>';
    selModelo.disabled = true;
    btnBuscar.disabled = true;

    if (marca && datosVehiculos[marca]) {
      selModelo.disabled = false;

      Object.keys(datosVehiculos[marca]).forEach(function(modelo) {
        const opt = document.createElement('option');
        opt.value = modelo;
        opt.textContent = modelo;
        selModelo.appendChild(opt);
      });
    }

    actualizarInfo();
  });

  // Cambio de modelo
  selModelo.addEventListener('change', function() {
    const marca = selMarca.value;
    const modelo = selModelo.value;

    btnBuscar.disabled = !(marca && modelo);
    actualizarInfo();
  });

  // Click en buscar
  btnBuscar.addEventListener('click', function() {
    const marca = selMarca.value;
    const modelo = selModelo.value;

    if (marca && modelo && datosVehiculos[marca][modelo]) {
      const url = datosVehiculos[marca][modelo];
      window.location.href = url;
    }
  });

  // Inicializar
  cargarMarcas();
})();
</script>
